[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:backend]
command=/bin/sh /app/start-backend.sh
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; No `environment=` allowlist here on purpose. supervisord passes its own
; environment to child processes by default, so the backend simply inherits
; everything Coolify injected into the container.
;
; The previous explicit list was both incomplete and fragile: it omitted
; FRONTEND_URL and API_KEY (which server.ts requires in production, so the
; process exited on boot), and every `%(ENV_X)s` reference in it makes
; supervisord refuse to start outright when X is unset - so adding an optional
; variable to the list would turn a missing IMAP setting into a dead container.
;
; Forward SIGTERM and give the server time to drain in-flight requests before
; supervisord escalates to SIGKILL. Must stay above SHUTDOWN_TIMEOUT_MS
; (default 10s) in backend/src/server.ts.
stopsignal=TERM
stopwaitsecs=15
priority=20
