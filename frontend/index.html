<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Self-hosted brand assets. The favicon previously pointed at a
         third-party CDN, leaving the browser tab dependent on someone else
         staying up. Overwrite the files in public/brand/ to swap the artwork;
         see public/brand/README.md. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#DE1C1C" />
    <title>Drona Logitech Dashboard</title>
    <!-- Runtime configuration, written by the container entrypoint before nginx
         serves. Must load before the app bundle. See src/lib/runtimeEnv.ts. -->
    <script src="/env.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="date-picker-portal"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
