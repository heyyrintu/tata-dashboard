# Main nginx configuration for Alpine Linux
user nginx;
worker_processes auto;
pcre_jit on;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Cache policy, resolved per request URI.
    #
    # This lives in a `map` feeding ONE server-level `add_header` on purpose:
    # nginx does not inherit `add_header` directives into a location block that
    # declares its own, so setting Cache-Control inside a location would
    # silently drop the security headers below for exactly those responses.
    #
    # Exact keys win over the regex regardless of the order they appear in.
    map $uri $cache_control {
        # index.html names the hashed bundles - a stale copy pins the browser
        # to a previous deploy. Everything unrecognised is uncached too.
        default      "no-store, no-cache, must-revalidate";

        # Hashed build assets: the filename changes whenever the content does.
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$
                     "public, max-age=31536000, immutable";

        # Runtime configuration, rewritten by docker-entrypoint.sh on every
        # boot. Must never be cached, or a container restarted with new Coolify
        # variables keeps serving the previous config. Overrides the .js rule.
        /env.js      "no-store, no-cache, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security and cache headers. Every add_header for this server lives
        # here so that none of them is lost to location-level shadowing.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control always;

        # Increase max body size for file uploads
        client_max_body_size 50M;

        # NOTE: no per-location cache blocks - Cache-Control comes from the
        # $cache_control map above, so static assets, index.html and /env.js
        # keep the security headers too.

        # Proxy API requests to backend
        location /api {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check endpoint - proxy to backend
        location /health {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Handle React Router (SPA) - must be last
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
